<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Area Hub | Scripts</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
/* ===== 共通世界観 ===== */
body{
  margin:0;
  min-height:100vh;
  background:#000;
  color:#e5e7eb;
  font-family:"Segoe UI",system-ui,sans-serif;
}
body::before{
  content:"";
  position:fixed;
  inset:-20%;
  background:
    radial-gradient(circle at 20% 30%, rgba(128,0,255,.22), transparent 55%),
    radial-gradient(circle at 80% 40%, rgba(0,100,255,.22), transparent 55%),
    radial-gradient(circle at 50% 80%, rgba(255,0,80,.16), transparent 60%),
    linear-gradient(120deg,#020617,#000,#020617);
  animation:bgFlow 26s ease-in-out infinite alternate;
  z-index:-2;
}
@keyframes bgFlow{
  from{transform:scale(1);filter:hue-rotate(0deg)}
  to{transform:scale(1.15);filter:hue-rotate(10deg)}
}
.glow{
  text-shadow:0 0 10px rgba(160,120,255,.6),0 0 28px rgba(120,120,255,.4);
}

/* ===== NAV ===== */
nav{
  position:sticky;top:0;z-index:40;
  backdrop-filter:blur(16px);
  background:rgba(0,0,0,.6);
  border-bottom:1px solid rgba(120,120,255,.15);
}
nav a{
  margin:0 1rem;font-weight:800;color:#a5b4fc;transition:.3s;
}
nav a:hover{
  color:#e879f9;
  text-shadow:0 0 10px rgba(232,121,249,.8);
}

/* ===== CARD ===== */
.card{
  max-width:1000px;
  margin:3rem auto;
  padding:2.8rem;
  border-radius:24px;
  background:rgba(255,255,255,.04);
  backdrop-filter:blur(18px);
  border:1px solid rgba(120,120,255,.15);
  box-shadow:0 0 70px rgba(0,0,0,.9);
}

/* ===== SCRIPT CARD ===== */
.script-card{
  padding:1.6rem;
  border-radius:18px;
  border:1px solid rgba(120,120,255,.25);
  background:rgba(0,0,0,.4);
  transition:.35s;
}
.script-card:hover{
  background:rgba(120,120,255,.06);
  box-shadow:0 0 25px rgba(120,120,255,.55);
}
.copy-btn{
  margin-top:1rem;
  padding:.6rem 1.4rem;
  border-radius:999px;
  border:1px solid rgba(120,120,255,.35);
  color:#c7d2fe;
  transition:.3s;
}
.copy-btn:hover{
  background:rgba(120,120,255,.15);
  box-shadow:0 0 18px rgba(120,120,255,.6);
}
</style>
</head>

<body>

<!-- NAV -->
<nav class="text-center py-4">
  <a href="index.html">HOME</a>
  <a href="scripts.html">Scripts</a>
  <a href="executors.html">Executors</a>
  <a href="bypass.html">Bypass</a>
  <a href="tools.html">Tools</a>
</nav>

<!-- CONTENT -->
<section class="card">
  <h1 class="text-4xl font-black glow mb-8 text-center">Scripts</h1>

  <div class="grid md:grid-cols-2 gap-6">

    <!-- Script Card -->
    <div class="script-card">
      <h2 class="text-xl font-bold glow">Auto Farm</h2>
      <p class="mt-2 opacity-85 leading-relaxed">
        自動化系の研究用スクリプトカテゴリ。
        動作挙動や処理フローを確認する目的で利用されることが多い構成です。
      </p>
      <button class="copy-btn" onclick="copyText()">
        コピー
      </button>
    </div>

    <div class="script-card">
      <h2 class="text-xl font-bold glow">Utility</h2>
      <p class="mt-2 opacity-85 leading-relaxed">
        利便性向上を目的とした補助系スクリプト。
        UI挙動やイベント処理の研究用途として扱われます。
      </p>
      <button class="copy-btn" onclick="copyText()">
        コピー
      </button>
    </div>

    <div class="script-card">
      <h2 class="text-xl font-bold glow">Movement</h2>
      <p class="mt-2 opacity-85 leading-relaxed">
        移動・挙動制御に関するスクリプトカテゴリ。
        ゲームエンジン側の物理挙動理解に役立ちます。
      </p>
      <button class="copy-btn" onclick="copyText()">
        コピー
      </button>
    </div>

    <div class="script-card">
      <h2 class="text-xl font-bold glow">AFK / Idle</h2>
      <p class="mt-2 opacity-85 leading-relaxed">
        放置・状態維持に関する仕組みを確認するためのカテゴリ。
        研究・検証用途向けにまとめられています。
      </p>
      <button class="copy-btn" onclick="copyText()">
        コピー
      </button>
    </div>

  </div>

  <!-- ScriptBlox -->
  <div class="text-center mt-12">
    <a href="https://scriptblox.com/" target="_blank"
       class="inline-block px-6 py-3 rounded-xl border border-indigo-400/30 glow">
      ScriptBlox
    </a>
  </div>

</section>

<script>
function copyText(){
  navigator.clipboard.writeText("コミュニティ参加をお願い致します。");
}
</script>

</body>
</html>
